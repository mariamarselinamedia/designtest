<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Expense Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: '#3b82f6' }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight">Expense & Budget Visualizer</h1>
            <button id="themeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                🌓 Toggle Theme
            </button>
        </header>

        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 mb-8 text-center">
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Total Spent</h2>
            <div id="totalBalance" class="text-5xl font-extrabold text-brand">$0.00</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
                    <h3 class="text-lg font-semibold mb-4 border-b pb-2 dark:border-gray-700">Add Transaction</h3>
                    
                    <form id="expenseForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Item Name</label>
                            <input type="text" id="itemName" required placeholder="e.g. Groceries"
                                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand outline-none transition">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-1">Amount ($)</label>
                            <input type="number" id="itemAmount" required min="0.01" step="0.01" placeholder="0.00"
                                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand outline-none transition">
                        </div>
                        
                        <div>
                            <div class="flex justify-between items-end mb-1">
                                <label class="block text-sm font-medium">Category</label>
                                <button type="button" id="addCategoryBtn" class="text-xs text-brand hover:underline">
                                    + Add Custom
                                </button>
                            </div>
                            <select id="itemCategory" required
                                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand outline-none transition">
                                </select>
                        </div>
                        
                        <button type="submit" 
                            class="w-full bg-brand hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition shadow-md mt-2">
                            Add Transaction
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col">
                    <div class="flex justify-between items-center border-b pb-2 dark:border-gray-700 mb-4">
                        <h3 class="text-lg font-semibold">Transactions</h3>
                        <select id="sortSelect" class="text-sm bg-transparent border-none outline-none cursor-pointer dark:bg-gray-800">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="high">Amount: High to Low</option>
                            <option value="low">Amount: Low to High</option>
                        </select>
                    </div>
                    
                    <div id="transactionList" class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-3 max-h-[350px]">
                        </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col items-center justify-center">
                    <h3 class="text-lg font-semibold mb-4 w-full text-left border-b pb-2 dark:border-gray-700">Spending by Category</h3>
                    <div class="relative w-full aspect-square max-w-[280px]">
                        <canvas id="spendingChart"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
